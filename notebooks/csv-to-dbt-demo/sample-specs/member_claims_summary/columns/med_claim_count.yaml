column:
  data_type: INTEGER
  description: Number of medical claim lines.
  exclude_from_change_detection: false
  name: med_claim_count
  nullable:
    default: true
  preserve_literal_null: false
derivation:
  candidates:
    - column: ps_unique_id
      expression: COUNT(*)
      priority: 1
      table: med_claims
  survivorship:
    default_value: 0
    explanation: Medical claim lines per member; 0 when none.
    strategy: single_source
