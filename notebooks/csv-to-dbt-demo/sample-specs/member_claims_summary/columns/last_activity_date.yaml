column:
  data_type: DATE
  description: Most recent activity across medical and pharmacy feeds.
  exclude_from_change_detection: false
  name: last_activity_date
  nullable:
    default: true
  preserve_literal_null: false
derivation:
  candidates:
    - column: srv_start_dt
      expression: MAX(srv_start_dt)
      priority: 1
      table: med_claims
    - column: disp_dt
      expression: MAX(disp_dt)
      priority: 2
      table: rx_claims
  survivorship:
    explanation: GREATEST of the latest medical service date and 
      pharmacy dispense date.
    strategy: max_across_sources
