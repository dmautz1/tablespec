column:
  data_type: INTEGER
  description: Number of pharmacy claims.
  exclude_from_change_detection: false
  name: rx_claim_count
  nullable:
    default: true
  preserve_literal_null: false
derivation:
  candidates:
    - column: ps_unique_id
      expression: COUNT(*)
      priority: 1
      table: rx_claims
  survivorship:
    default_value: 0
    explanation: Pharmacy claims per member; 0 when none.
    strategy: single_source
