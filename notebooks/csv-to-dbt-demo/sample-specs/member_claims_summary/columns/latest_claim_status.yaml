  description: Status of the member's most recent claim line.
  exclude_from_change_detection: false
  length: 1
  name: latest_claim_status
  nullable:
    default: true
  preserve_literal_null: false
derivation:
  candidates:
    - column: clm_ln_status_cd
      expression: MAX_BY(clm_ln_status_cd, srv_start_dt)
      priority: 1
      table: med_claims
  survivorship:
    explanation: Status (P/D) of the most recent medical claim line.
    strategy: single_source
