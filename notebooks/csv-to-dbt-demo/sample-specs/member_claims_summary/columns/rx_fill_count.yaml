column:
  data_type: INTEGER
  description: Number of pharmacy fills for the member.
  exclude_from_change_detection: false
  name: rx_fill_count
  nullable:
    default: true
  preserve_literal_null: false
derivation:
  candidates:
    - column: rx_id
      expression: COUNT(*)
      priority: 1
      table: rx
  survivorship:
    default_value: 0
    explanation: Count of pharmacy fills per member; 0 when none.
    strategy: single_source
