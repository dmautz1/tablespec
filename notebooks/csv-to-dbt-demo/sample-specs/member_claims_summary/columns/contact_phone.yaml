column:
  data_type: VARCHAR
  description: Best-known phone via 3-way survivorship.
  exclude_from_change_detection: false
  length: 20
  name: contact_phone
  nullable:
    default: true
  preserve_literal_null: false
derivation:
  candidates:
    - column: phone
      priority: 1
      reason: Demographic file is authoritative when populated.
      table: members
    - column: contact_phone
      priority: 2
      reason: Phone recorded at medical-claim submission.
      table: claims
    - column: member_phone
      priority: 3
      reason: Pharmacy-recorded phone is the last resort.
      table: rx
  survivorship:
    default_value: UNKNOWN
    explanation: First non-empty phone by priority members > claims > 
      rx; UNKNOWN when no source has one.
    strategy: highest_priority
