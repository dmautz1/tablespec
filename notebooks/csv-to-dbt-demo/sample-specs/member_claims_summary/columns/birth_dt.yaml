column:
  data_type: DATE
  description: Best-known birth date via 3-way survivorship.
  exclude_from_change_detection: false
  name: birth_dt
  nullable:
    default: true
  preserve_literal_null: false
derivation:
  candidates:
    - column: birth_dt
      priority: 1
      reason: The roster is authoritative when populated.
      table: members
    - column: birth_dt
      priority: 2
      reason: Birth date recorded on the medical claim line.
      table: med_claims
    - column: src_mbr_birth_dt
      priority: 3
      reason: Pharmacy-recorded birth date is the last resort.
      table: rx_claims
  survivorship:
    explanation: First non-null birth date by priority members > med > 
      rx.
    strategy: highest_priority
